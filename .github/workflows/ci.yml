name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python -m pip install -r backend/requirements.txt pyinstaller
      - run: pyinstaller llama-center.spec --noconfirm
      - name: Build installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        # Version is single-sourced from package.json — pass it to ISCC.
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v installer\llama-center.iss
      - uses: actions/upload-artifact@v4
        with:
          name: llama-center-${{ matrix.os }}
          path: dist/llama-center
      - name: Stage installer (Windows)
        if: matrix.os == 'windows-latest'
        run: Copy-Item dist/llama-center-setup-*.exe ./
      - name: Stage installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf llama-center-linux-x86_64.tar.gz -C dist llama-center
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: llama-center-setup-win
          path: llama-center-setup-*.exe
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: llama-center-setup-linux
          path: llama-center-linux-x86_64.tar.gz

  release:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: llama-center-setup-win
      - uses: actions/download-artifact@v4
        with:
          name: llama-center-setup-linux
      - name: Get version
        id: ver
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            llama-center-setup-*.exe
            llama-center-linux-x86_64.tar.gz
