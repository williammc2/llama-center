[project]
name = "llama-center-backend"
version = "0.1.0"
description = "llama-center Python backend (pywebview shell)"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.17",
    "types-requests",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "SIM", "RET", "C90"]
ignore = [
    "C901",  # parse_config's complexity is the validation table, not nesting
    "N803",  # camelCase is the API boundary (config keys)
    "N806",  # module-level constants like EVENT_MODIFY_STATE
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["N812"]  # `import singleton as S` style in tests

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
